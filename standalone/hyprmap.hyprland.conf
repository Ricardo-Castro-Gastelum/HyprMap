# HyprMap — Hyprland config snippet (standalone build).
#
# Append these two lines to ~/.config/hypr/hyprland.conf and
# re-login, or run `hyprctl reload` after launching HyprMap once.

# Autostart the minimap (always visible by default)
exec-once = quickshell -c hyprmap

# SUPER + M toggles the minimap
bind = SUPER, M, exec, quickshell ipc -c hyprmap call hyprmap toggle